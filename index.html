        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);

        }
        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://mt0.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {

            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20

        layer_GoogleSatellite_0;

        function pop_Adm_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">id</th>\
                        <td>' + (feature.properties['id'] !== null ? autolinker.link(feature.properties['id'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Kecamatan</th>\
                        <td class="visible-with-data" id="Kecamatan">' + (feature.properties['Kecamatan'] !== null ? autolinker.link(feature.properties['Kecamatan'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Luas</th>\
                        <td class="visible-with-data" id="Luas">' + (feature.properties['Luas'] !== null ? autolinker.link(feature.properties['Luas'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        map.createPane('pane_Adm_1');
        map.getPane('pane_Adm_1').style.zIndex = 401;
        map.getPane('pane_Adm_1').style['mix-blend-mode'] = 'normal';
        var layer_Adm_1 = new L.geoJson(json_Adm_1, {
            attribution: '',

            layerName: 'layer_Adm_1',

        });
        bounds_group.addLayer(layer_Adm_1);
        map.addLayer(layer_Adm_1);
        var overlaysTree = [
            {label: 'Adm<br /><table><tr><td style="text-align: center;"><img src="legend/Adm_1_KecBanjarejo0.png" /></td><td>Kec. Banjarejo</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecBlora1.png" /></td><td>Kec. Blora</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecBogorejo2.png" /></td><td>Kec. Bogorejo</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecCepu3.png" /></td><td>Kec. Cepu</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecJapah4.png" /></td><td>Kec. Japah</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecJati5.png" /></td><td>Kec. Jati</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecJepon6.png" /></td><td>Kec. Jepon</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecJiken7.png" /></td><td>Kec. Jiken</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecKedungtuban8.png" /></td><td>Kec. Kedungtuban</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecKradenan9.png" /></td><td>Kec. Kradenan</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecKunduran10.png" /></td><td>Kec. Kunduran</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecNgawen11.png" /></td><td>Kec. Ngawen</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecRandublatung12.png" /></td><td>Kec. Randublatung</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecSambong13.png" /></td><td>Kec. Sambong</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecTodanan14.png" /></td><td>Kec. Todanan</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_KecTunjungan15.png" /></td><td>Kec. Tunjungan</td></tr><tr><td style="text-align: center;"><img src="legend/Adm_1_16.png" /></td><td></td></tr></table>', layer: layer_Adm_1},

            //namedToggle: true,

		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();
